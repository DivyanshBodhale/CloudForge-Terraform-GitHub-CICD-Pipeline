name: code linting html 

on: 
    push: 
      branches: main 
    
jobs:

    code-linting:

       name: html code lint
       runs-on: ubuntu-latest

       steps: 

        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Install HTMLHint
          run: npm install -g htmlhint

        - name: Lint HTML
          run: htmlhint "*.html"
